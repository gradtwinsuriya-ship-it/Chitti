services:
  chitti:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      FILE_SEARCH_ROOT: ${FILE_SEARCH_ROOT:-/app/data/documents}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped